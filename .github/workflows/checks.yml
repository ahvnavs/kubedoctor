name: KubeDoctor checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubedoctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: pip install -e '.[dev]'
      - name: Run static and unit checks
        run: make check
      - name: Build the CLI image
        run: make image
      - name: Install kind
        env:
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl --fail --location --silent --show-error \
            --output kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "$KIND_SHA256  kind" | sha256sum --check --strict
          sudo install kind /usr/local/bin/kind
      - name: Verify diagnoses in kind
        run: make lab-up lab-verify
      - name: Show cluster state on failure
        if: failure()
        run: kubectl get pods --all-namespaces -o wide || true
      - name: Remove the test cluster
        if: always()
        run: make lab-down

